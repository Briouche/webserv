<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            padding: 50px;
        }
        h1 {
            color: #e74c3c;
            font-size: 50px;
        }
        p {
            font-size: 20px;
        }
        img {
            max-width: 900px;
            margin: 20px auto;
            display: block;
        }
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <img src="../images/404Image.jpg" alt="man dissapointed">
    <p>Looks like we can't find what you're looking for!</p>
    <p>Maybe try <a href="/">going back home</a>?</p>
</body>
</html>
