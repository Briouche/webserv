<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>504 - Gateway Timeout</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .error-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 50px;
            color: #d9534f;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        a {
            color: #337ab7;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .error-image {
            margin: 20px auto;
            max-width: 100%;
            height: auto;
        }
        .image-placeholder {
            color: #777;
            font-style: italic;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>504</h1>
        <h2>Gateway Timeout</h2>
        <div class="image-placeholder" id="imagePlaceholder">
        </div>
        <img
            class="error-image"
            src="https://www.shutterstock.com/image-photo/waiting-concept-human-skeleton-table-600nw-2462855347.jpg"
            alt="Illustration d'attente"
            onerror="document.getElementById('imagePlaceholder').style.display='block'; this.style.display='none';"
        >
        <p>Le serveur n'a pas reçu de réponse à temps pour traiter votre requête.</p>
        <p>Veuillez réessayer plus tard ou <a href="/">retourner à la page d'accueil</a>.</p>
    </div>
</body>
</html>
