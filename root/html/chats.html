<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat.exe — Les chats ont pris le contrôle</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
  body { background:#fdf6ec; font-family:'Nunito', sans-serif; color:#3a2e28; min-height:100vh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; z-index:0; background-image: radial-gradient(circle, rgba(255,123,84,0.07) 1px, transparent 1px); background-size:40px 40px; pointer-events:none; }

  header { text-align:center; padding:48px 20px 16px; z-index:1; position:relative; }
  header h1 { font-family:'Fredoka One', cursive; font-size:clamp(2.4rem,6vw,4rem); color:#ff7b54; letter-spacing:2px; }
  header p { margin-top:8px; font-weight:600; color:#9a8880; }
  .paw-row { font-size:1.4rem; letter-spacing:6px; margin-top:10px; animation:drift 4s ease-in-out infinite; }
  @keyframes drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(8px)} }

  .walker-strip { position:relative; height:64px; overflow:hidden; margin:20px 0; border-top:1px solid rgba(0,0,0,0.08); border-bottom:1px solid rgba(0,0,0,0.08); background:rgba(255,255,255,0.5); z-index:1; }
  .walker { position:absolute; top:0; animation:walk 8s linear infinite; }

  @keyframes walk { from{left:-80px} to{left:110%} }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:20px; padding:32px 24px; max-width:1200px; margin:0 auto; z-index:1; position:relative; }
  .cat-card { background:#fff; border:1.5px solid rgba(0,0,0,0.08); border-radius:20px; display:flex; flex-direction:column; align-items:center; padding:20px 10px 14px; cursor:pointer; position:relative; transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s; animation:floatCard 3s ease-in-out infinite; }
  .cat-card:hover { transform: translateY(-6px) scale(1.04); box-shadow:0 12px 32px rgba(255,123,84,0.18); border-color:#ff7b54; }
  .cat-card:active { transform:scale(0.97); }
  @keyframes floatCard { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .cat-svg { width:80px; height:80px; }
  .eyes { animation:blink 4.5s ease-in-out infinite; transform-origin:center 34px; }
  @keyframes blink { 0%,88%,100%{transform:scaleY(1)} 93%{transform:scaleY(0.08)} }
  .tail { animation:wag 1.4s ease-in-out infinite; transform-origin:36px 64px; }
  @keyframes wag { 0%,100%{transform:rotate(-18deg)} 50%{transform:rotate(18deg)} }
  .cat-name { margin-top:10px; font-size:12px; font-weight:700; color:#9a8880; text-align:center; letter-spacing:0.5px; }
  .cat-mood { font-size:18px; margin-top:4px; }
  .bubble { position:absolute; top:6px; right:10px; font-size:11px; font-weight:700; color:#ff7b54; opacity:0; pointer-events:none; white-space:nowrap; }
  .bubble.pop { animation:meow 1.1s ease forwards; }
  @keyframes meow { 0%{opacity:0; transform:translateY(0) scale(0.6);} 20%{opacity:1; transform:translateY(-4px) scale(1.1);} 80%{opacity:1; transform:translateY(-10px) scale(1);} 100%{opacity:0; transform:translateY(-24px) scale(0.8);} }

  .yarn-section { text-align:center; padding:20px 0 48px; font-size:13px; color:#9a8880; font-weight:600; z-index:1; position:relative; }
  .yarn { display:inline-block; font-size:2.5rem; animation:spin 3s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  @media (max-width:480px){ .grid { gap:14px; padding:20px 14px; } }
</style>
</head>
<body>

<header>
  <h1>🐱 chat.exe</h1>
  <p>Les chats ont pris le contrôle du serveur</p>
  <div class="paw-row">🐾 🐾 🐾 🐾 🐾</div>
</header>

<div class="walker-strip" id="walker-strip"></div>

<div class="grid" id="catgrid"></div>

<div class="yarn-section">
  <div class="yarn">🧶</div>
  <p style="margin-top:8px">Cliquez sur un chat pour l'entendre miauler et marcher ✨</p>
</div>

<script>
const cats = [
  { name:"Monsieur Flouf", color:"#c8a97e", ear:"#d4a888", nose:"#e8897a", mood:"😴" },
  { name:"Nuit", color:"#555", ear:"#666", nose:"#e8897a", mood:"😼" },
  { name:"Chaussette", color:"#efefef", ear:"#f5c6c0", nose:"#f4b0b0", mood:"🥺" },
  { name:"Mochi", color:"#f0c8a0", ear:"#f5b898", nose:"#e87a7a", mood:"😻" },
  { name:"Baron Poivre", color:"#999", ear:"#aaa", nose:"#e8897a", mood:"🎩" },
  { name:"Princesse", color:"#d4a0c8", ear:"#e0b0d8", nose:"#e87a9a", mood:"👑" },
  { name:"Tornado", color:"#b07040", ear:"#c08050", nose:"#e8897a", mood:"⚡" },
  { name:"Fantôme", color:"#f0f0f0", ear:"#f5c6c0", nose:"#eeb0b0", mood:"👻" },
  { name:"Commissaire", color:"#667", ear:"#778", nose:"#e8897a", mood:"🔍" },
  { name:"Beurre", color:"#f5d98a", ear:"#f0c070", nose:"#e8897a", mood:"🧈" },
  { name:"Zéphyr", color:"#a0c8d4", ear:"#b0d8e0", nose:"#e87a9a", mood:"💨" },
  { name:"Professeur Miau", color:"#c8c8a0", ear:"#d8d8b0", nose:"#e8897a", mood:"📚" },
];

const meows = ["Miaou !","Prrrr~","Mrrrow !","Nya !","Miaaa~","MIIIAOU !","...mew","Purrrr 💕"];

function catSVG(c) {
  const stripes = Math.random() > 0.5;
  const stripeColor = shadeColor(c.color,-25);
  return `<svg class="cat-svg" viewBox="0 0 44 72">
    <ellipse cx="22" cy="54" rx="13" ry="11" fill="${c.color}"/>
    <circle cx="22" cy="24" r="14" fill="${c.color}"/>
    <polygon points="8,13 11,2 16,13" fill="${c.ear}"/>
    <polygon points="28,13 33,2 36,13" fill="${c.ear}"/>
    <polygon points="9,13 11,6 15,13" fill="#f5c6c0" opacity=".7"/>
    <polygon points="29,13 33,6 35,13" fill="#f5c6c0" opacity=".7"/>
    ${stripes ? `<line x1="9" y1="22" x2="17" y2="20" stroke="${stripeColor}" stroke-width="1.5" opacity=".45"/>
                  <line x1="9" y1="26" x2="17" y2="25" stroke="${stripeColor}" stroke-width="1.5" opacity=".45"/>
                  <line x1="27" y1="20" x2="35" y2="22" stroke="${stripeColor}" stroke-width="1.5" opacity=".45"/>
                  <line x1="27" y1="25" x2="35" y2="26" stroke="${stripeColor}" stroke-width="1.5" opacity=".45"/>` : ''}
    <g class="eyes"><ellipse cx="17" cy="24" rx="3.5" ry="4" fill="#111"/><ellipse cx="27" cy="24" rx="3.5" ry="4" fill="#111"/><circle cx="18.5" cy="22.5" r="1.2" fill="white"/><circle cx="28.5" cy="22.5" r="1.2" fill="white"/></g>
    <ellipse cx="22" cy="30" rx="2" ry="1.5" fill="${c.nose}"/>
    <path d="M20 31.5 Q22 34.5 24 31.5" stroke="#c06060" fill="none" stroke-width="1.2"/>
    <g class="tail"><path d="M34 60 Q50 50 48 64 Q46 72 37 68" stroke="${c.color}" fill="none" stroke-width="4" stroke-linecap="round"/></g>
  </svg>`;
}

function shadeColor(hex,pct){
  const n=parseInt(hex.replace('#',''),16);
  const f=pct/100;
  const r=Math.min(255,Math.max(0,(n>>16)+Math.round(255*f)));
  const g=Math.min(255,Math.max(0,((n>>8)&0xff)+Math.round(255*f)));
  const b=Math.min(255,Math.max(0,(n&0xff)+Math.round(255*f)));
  return `rgb(${r},${g},${b})`;
}

const grid = document.getElementById('catgrid');
const walkerStrip = document.getElementById('walker-strip');
const maxWalkers = 20;

function addWalker(catSVGElement){
  if(walkerStrip.children.length >= maxWalkers) walkerStrip.removeChild(walkerStrip.firstChild);
  const walker = catSVGElement.cloneNode(true);
  walker.classList.add('walker');
  walker.style.top = (Math.random()*20 + 5)+'px';
  walker.style.animationDuration = (6 + Math.random()*4)+'s';
  walkerStrip.appendChild(walker);
}

cats.forEach((cat,i)=>{
  const div=document.createElement('div');
  div.className='cat-card';
  div.innerHTML=`<span class="bubble" id="b${i}"></span>${catSVG(cat)}<div class="cat-name">${cat.name}</div><div class="cat-mood">${cat.mood}</div>`;
  div.addEventListener('click',()=>{
    const b=document.getElementById('b'+i);
    b.textContent=meows[Math.floor(Math.random()*meows.length)];
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
    addWalker(div.querySelector('.cat-svg'));
  });
  grid.appendChild(div);
});
</script>

</body>
</html>
